<script>
const q=new URLSearchParams(location.search);
window.setT=function(t){document.querySelectorAll("[data-in]").forEach(e=>{const s=+e.dataset.in,d=+(e.dataset.d||.8),p=Math.min(1,Math.max(0,(t-s)/d)),k=1-Math.pow(1-p,3);e.style.opacity=k;e.style.transform="translateY("+((1-k)*(+(e.dataset.y||40)))+"px)"});
document.querySelectorAll("[data-zoom]").forEach(e=>{const [a,b,dur]=e.dataset.zoom.split(",").map(Number);e.style.transform="scale("+(a+(b-a)*Math.min(1,t/dur))+")"})};
if(q.has("t"))setT(+q.get("t"));
</script>
