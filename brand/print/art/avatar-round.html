<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../../../assets/css/brand.css"><link rel="stylesheet" href="ag.css"><title>Avatar round</title>
<style>
html,body{background:transparent}
.a{width:1080px;height:1080px;border-radius:50%;background:var(--porcelain);overflow:hidden}
.a .band{position:absolute;inset:0;border-radius:50%;border:96px solid var(--cobalt)}
.a .band2{position:absolute;inset:96px;border-radius:50%;border:3px solid var(--gold)}
.a .arch{position:absolute;left:50%;top:128px;width:420px;height:400px;margin-left:-210px;background:var(--night);border-radius:210px 210px 4px 4px;border:3px solid var(--gold);overflow:hidden}
.a .arch .tt{position:absolute;inset:0;opacity:.35}
.a .med{position:absolute;left:50%;top:250px;width:300px;margin-left:-150px}
.a .nm{position:absolute;left:0;right:0;top:560px;text-align:center;font-size:170px;color:var(--ink);line-height:1}
.a .nm i{color:var(--cobalt)}.a .nm .b{display:block;font-size:112px;margin-top:2px}
.a .sub{position:absolute;left:0;right:0;top:850px;text-align:center;font-size:28px;color:var(--gold-lo);letter-spacing:.34em;font-weight:600}
</style></head><body>
<div class="ab a" style="background:var(--porcelain)"><div class="band"></div><div class="band2"></div>
<div class="arch"><div class="tt tile-g"></div></div><img class="med" src="medallion.png" alt="">
<div class="nm disp">Auntie<span class="b"><i>Gaik</i> Lean's</span></div><div class="sub lbl">Old School Eatery</div></div></body></html>
