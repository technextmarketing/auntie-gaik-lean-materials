<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The menu · Auntie Gaik Lean's Old School Eatery</title>
<meta name="description" content="The printable menu of Auntie Gaik Lean’s Old School Eatery, Penang: six chapters, three A4 pages.">
<link rel="icon" href="../assets/site/favicon.png">
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&amp;text=%E7%94%B2%E5%BF%85%E4%B8%B9%E5%92%96%E5%93%A9%E9%B8%A1%E8%8F%9C%E8%84%AF%E8%9B%8B%E5%92%B8%E9%B8%AD%E9%BB%91%E7%B3%AF%E7%B1%B3&amp;display=swap">
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #d5dbea; font-family: var(--f-sans); color: var(--ink); }
.pg { position: relative; width: 210mm; height: 297mm; margin: 0 auto 10mm; overflow: hidden; background: var(--porcelain); page-break-after: always; break-after: page; }
.pg:last-child { page-break-after: auto; break-after: auto; margin-bottom: 0; }
@media print { body { background: none; } .pg { margin: 0; } }
.band { position: absolute; left: 0; right: 0; top: 0; height: 9mm; background: var(--cobalt) url("../assets/pattern/tile-gold.svg") 0 0 / 9mm; }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .7mm; background: var(--gold); }
.in { position: absolute; inset: 19mm 18mm 15mm; display: flex; flex-direction: column; }
.run { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 3.5mm; border-bottom: .3mm solid var(--gold); font: 500 7.5pt/1 var(--f-sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gold-lo); }
.sec { margin-top: 5mm; }
.sec:first-of-type { margin-top: 6mm; }
.sh { display: flex; align-items: baseline; gap: 4mm; }
.sh b { font: italic 400 24pt/1 var(--f-display); color: var(--gold-lo); }
.sh h2 { margin: 0; font: 500 22pt/1.12 var(--f-display); font-variation-settings: "opsz" 28; letter-spacing: -.01em; padding-bottom: .06em; }
.sl { margin: 2.2mm 0 0; font-size: 9.5pt; line-height: 1.45; color: var(--ink-2); max-width: 120mm; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3.6mm 8mm; margin-top: 3.6mm; }
.grid.g3 { grid-template-columns: repeat(3, 1fr); gap: 3mm 6mm; }
.sec { break-inside: avoid; }
.d { break-inside: avoid; padding-top: 2mm; border-top: .2mm solid rgba(29,63,143,.3); }
.d h3 { margin: 0; font: 500 13.5pt/1.15 var(--f-display); font-variation-settings: "opsz" 28; padding-bottom: .05em; }
.d .lc { margin: .8mm 0 0; font: italic 400 9.5pt/1.3 var(--f-display); color: var(--ink-2); }
.d .lc .zh { font-size: 8.5pt; margin-left: 2.5mm; color: var(--cobalt); font-style: normal; }
.d p.ds { margin: 1mm 0 0; font-size: 8.5pt; line-height: 1.4; color: var(--ink); }
.d .pk { display: inline-block; margin-top: 1.4mm; font: 500 6.2pt/1.45 var(--f-sans); letter-spacing: .18em; text-transform: uppercase; color: var(--cobalt); }
.d .pk::before { content: "\25C6"; color: var(--gold); margin-right: 1.5mm; font-size: 5pt; }
.foot { position: absolute; left: 20mm; right: 20mm; bottom: 10mm; display: flex; justify-content: space-between; font: 400 7.5pt/1.4 var(--f-sans); color: var(--ink-2); }
.cover { background: var(--night); color: var(--porcelain); }
.cover .tile { position: absolute; inset: 0; background: url("../assets/pattern/tile-gold.svg") 0 0 / 22mm; opacity: .07; }
.cover .arch { position: absolute; left: 50%; top: 38mm; width: 150mm; height: 188mm; margin-left: -75mm; border: .3mm solid rgba(201,161,74,.7); border-bottom: 0; border-radius: 75mm 75mm 0 0; background: linear-gradient(180deg, rgba(29,63,143,.55), rgba(20,33,90,.1)); }
.cover .arch::before { content: ""; position: absolute; inset: 4mm 4mm 0; border: .2mm solid rgba(201,161,74,.35); border-bottom: 0; border-radius: 71mm 71mm 0 0; }
.cover .arch::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: url("../assets/pattern/tile-sky.svg") 50% 0 / 20mm; opacity: .35; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); }
.cover .logo { position: absolute; top: 16mm; left: 50%; width: 62mm; height: auto; margin-left: -31mm; }
.cover .ct { position: absolute; left: 0; right: 0; top: 98mm; text-align: center; }
.cover .eb { font: 500 8pt/1 var(--f-sans); letter-spacing: .34em; text-transform: uppercase; color: var(--gold-hi); }
.cover h1 { margin: 9mm 0 0; font: 500 70pt/.98 var(--f-display); font-variation-settings: "opsz" 28; letter-spacing: -.02em; padding-bottom: .08em; }
.cover h1 i { color: var(--gold-hi); font-weight: 400; display: block; }
.cover .sub { margin: 9mm auto 0; max-width: 100mm; font-size: 11pt; line-height: 1.55; color: var(--mist); }
.cover .rule { width: 40mm; margin: 11mm auto 0; display: flex; align-items: center; gap: 3mm; color: var(--gold); }
.cover .rule::before, .cover .rule::after { content: ""; flex: 1; height: .25mm; background: currentColor; }
.cover .rule span { width: 2.2mm; height: 2.2mm; transform: rotate(45deg); border: .25mm solid currentColor; }
.cover .info { position: absolute; left: 20mm; right: 20mm; bottom: 15mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8mm; text-align: center; font-size: 8.6pt; line-height: 1.55; color: var(--mist); }
.cover .info b { display: block; margin-bottom: 1.6mm; font: 500 6.8pt/1 var(--f-sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gold-hi); }
.closing { margin-top: auto; padding-top: 3mm; display: grid; grid-template-columns: 1fr; gap: 10mm; align-items: end; }
.closing .note { font: italic 400 13pt/1.4 var(--f-display); color: var(--ink); }
.closing .who { font-size: 8.6pt; line-height: 1.6; color: var(--ink-2); padding-left: 6mm; border-left: .3mm solid var(--gold); }
.closing .who b { display: block; font: 500 6.8pt/1 var(--f-sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gold-lo); margin-bottom: 1.6mm; }
</style>
</head>
<body>
<div id="doc"></div>
<script src="data.js"></script>
<script>
(function () {
  var M = window.AG_MENU, C = M.chapters;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  function sec(c, g3) {
    return '<section class="sec"><div class="sh"><b>' + p2(c.n) + '</b><h2>' + esc(c.title) + '</h2></div><p class="sl">' + esc(c.line) + '</p><div class="grid' + (g3 ? ' g3' : '') + '">' +
      c.dishes.map(function (d) {
        return '<div class="d"><h3>' + esc(d.name) + '</h3><p class="lc">' + esc(d.local) + (d.zh ? '<span class="zh" lang="zh-Hans">' + esc(d.zh) + '</span>' : '') + '</p><p class="ds">' + esc(d.desc) + '</p>' + (d.pick ? '<span class="pk">Noted by the MICHELIN Guide inspectors</span>' : '') + '</div>';
      }).join('') + '</div></section>';
  }
  function page(no, run, body) {
    return '<div class="pg"><div class="band"></div><div class="in"><div class="run"><span>Auntie Gaik Lean’s Old School Eatery</span><span>' + run + '</span></div>' + body + '</div><div class="foot"><span>1 Lebuh Bishop, George Town, 10200 Penang</span><span>' + no + ' / 3</span></div></div>';
  }
  var cover = '<div class="pg cover"><div class="tile"></div><div class="arch"></div><img class="logo" src="../assets/logo/logo-white.png" width="1144" height="371" alt="Auntie Gaik Lean’s Old School Eatery">' +
    '<div class="ct"><div class="eb">Auntie Gaik Lean’s</div><h1>The <i>menu</i></h1><div class="rule"><span></span></div>' +
    '<p class="sub">Six chapters from one family kitchen, cooked the Nyonya way. Everything made by hand, from scratch, on site.</p></div>' +
    '<div class="info"><div><b>Find us</b>1 Lebuh Bishop (Bishop Street)<br>George Town, 10200 Penang</div><div><b>Hours</b>Wed–Sun<br>Lunch 12pm–2.30pm · Dinner 6pm–9.30pm<br>Closed Mon and Tue</div><div><b>Book</b>Online booking advised<br>+60 17-434 4398<br>WhatsApp the same number</div></div></div>';
  var closing = '<div class="closing"><p class="note">' + esc(M.note) + '</p></div>';
  document.getElementById('doc').innerHTML = cover +
    page(2, 'The menu · chapters 01–02', sec(C[0]) + sec(C[1], 1)) +
    page(3, 'The menu · chapters 03–06', sec(C[2], 1) + sec(C[3], 1) + sec(C[4], 1) + sec(C[5], 1) + closing);
})();
</script>
</body>
</html>
